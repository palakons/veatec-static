name: Deploy to VISTEC SFTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [ self-hosted, vistec-intranet ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Test File via SFTP
        run: |
          sftp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no veatec@10.204.15.164 << 'EOF'
          cd veatec
          put test-sftp.html
          quit
          EOF
          echo "Deployment to 10.204.15.164:/veatec/ succeeded!"
