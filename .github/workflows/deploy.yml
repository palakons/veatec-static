name: Deploy Static Web to VISTEC SFTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [ self-hosted, vistec-intranet ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Sync Static Files to VISTEC SFTP
        run: |
          sftp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no veatec@10.204.15.164 << 'EOF'
          cd veatec
          put -r out/* .
          quit
          EOF
          echo "Deployment of Static Build to https://ist.vistec.ac.th/veatec/ succeeded!"
